<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59b2e"/>
      <stop offset="100%" stop-color="#b45c0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb961"/>
      <stop offset="100%" stop-color="#f59b2e"/>
    </linearGradient>
  </defs>

  <!-- 背景の角丸矩形 -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>

  <!-- インナー (暗色) -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="#05070f"/>

  <!-- 装飾リング -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59b2e" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59b2e" stroke-width="1" opacity="0.15"/>

  <!-- R の文字 (Unbounded 風に太く) -->
  <text x="256" y="330"
        font-family="'Unbounded', 'Arial Black', sans-serif"
        font-weight="900"
        font-size="260"
        fill="url(#glow)"
        text-anchor="middle"
        letter-spacing="-8">R</text>

  <!-- アクセントドット -->
  <circle cx="380" cy="380" r="10" fill="#f59b2e"/>
</svg>
